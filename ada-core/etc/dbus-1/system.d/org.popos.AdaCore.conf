<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="ada">
    <allow own="org.popos.AdaCore"/>
    <allow send_destination="org.popos.AdaCore"/>
    <allow receive_sender="org.popos.AdaCore"/>
  </policy>

  <policy user="root">
    <allow own="org.popos.AdaCore"/>
    <allow send_destination="org.popos.AdaCore"/>
    <allow receive_sender="org.popos.AdaCore"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.popos.AdaCore"/>
    <allow receive_sender="org.popos.AdaCore"/>
  </policy>
</busconfig>
