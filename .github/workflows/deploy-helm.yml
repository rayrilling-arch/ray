name: Deploy Ada Core on HELM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ada-core/**'

jobs:
  deploy:
    runs-on: [self-hosted, helm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ada Core
        run: sudo ada-core/scripts/install.sh

      - name: Verify Ada Core
        run: ada-core/scripts/verify.sh
