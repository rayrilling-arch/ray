name: Deploy Ada Core on HELM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ada-core/**'

jobs:
  deploy:
    runs-on: [self-hosted, helm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair Ada Core
        run: sudo ada-core/scripts/repair-ada-core.sh

      - name: Fix OpenClaw routing
        run: sudo ada-core/scripts/fix-openclaw-ada.sh

      - name: Full health check
        run: bash ada-core/scripts/check-everything.sh

      - name: Verify Ada Core
        run: ada-core/scripts/verify.sh
