name: Ada Core tests

on:
  push:
    branches: [main, 'cursor/**']
    paths:
      - 'ada-core/**'
  pull_request:
    paths:
      - 'ada-core/**'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          pip install httpx
          pip install -r ada-core/usr/lib/ada-core/requirements.txt

      - name: Run OpenClaw routing unit tests
        run: python3 ada-core/tests/test_openclaw_routing.py

      - name: Python syntax check
        run: python3 -m py_compile ada-core/usr/lib/ada-core/*.py

      - name: Shell script syntax
        run: |
          shellcheck -e SC1091 ada-core/scripts/*.sh || true
          bash -n ada-core/scripts/*.sh
